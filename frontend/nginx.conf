server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # DNS de Docker con caché corta: así nginx ve las réplicas nuevas tras
    # "docker compose up --scale api-reportes=N" y reparte entre ellas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # add_header no se hereda en locations que definen los suyos; por eso se incluye en cada una.
    include /etc/nginx/cabeceras-seguridad.conf;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ingesta/ {
        set $api_reportes http://api-reportes:8080;
        proxy_pass $api_reportes;
    }

    location /api/ {
        set $api_core http://api-core:8080;
        proxy_pass $api_core;
        # Server-Sent Events del mapa: sin búfer para que los cambios lleguen al instante.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # El service worker y el manifiesto deben revalidarse siempre para que las actualizaciones lleguen.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
